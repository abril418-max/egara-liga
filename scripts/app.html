<title>Liga de Dobles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera de pista (azul pista dura con líneas de dobles), pestañas, contenido en una columna de 1080px máx. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#14202e; --muted:#5a6778; --line:#d6dde6;
  --accent:#1d4e89; --accent-ink:#ffffff; --ball:#d6e31f; --ball-ink:#1d2a05;
  --win:#1c7a48; --win-bg:#e3f3ea; --loss:#b3372f; --loss-bg:#f8e6e4; --maybe:#9a6a0c; --maybe-bg:#f7eed9;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1520; --surface:#162130; --surface-2:#1b2838; --ink:#e5ebf2; --muted:#94a2b4; --line:#2a3849;
  --accent:#6fa3e3; --accent-ink:#0b1420; --ball:#d9e84a; --ball-ink:#1d2a05;
  --win:#53c48c; --win-bg:#173427; --loss:#f07d72; --loss-bg:#3a1d1c; --maybe:#e3b14e; --maybe-bg:#382c14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520; --surface:#162130; --surface-2:#1b2838; --ink:#e5ebf2; --muted:#94a2b4; --line:#2a3849;
  --accent:#6fa3e3; --accent-ink:#0b1420; --ball:#d9e84a; --ball-ink:#1d2a05;
  --win:#53c48c; --win-bg:#173427; --loss:#f07d72; --loss-bg:#3a1d1c; --maybe:#e3b14e; --maybe-bg:#382c14;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
/* Cabecera */
.top{background:#1d4e89;color:#fff;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:rgba(255,255,255,.85);box-shadow:0 5px 0 rgba(255,255,255,.55)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 26px}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:4px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 12px 10px;cursor:pointer;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:.02em}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid2>*{min-width:0}
/* Botones */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--loss);color:#fff}
.btn.small{padding:6px 10px;font-size:14px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:32px;font-weight:600;line-height:1.1}
/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.win{background:var(--win-bg);color:var(--win)}
.chip.loss{background:var(--loss-bg);color:var(--loss)}
.chip.pend{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.maybe{background:var(--maybe-bg);color:var(--maybe)}
.chip.ball{background:var(--ball);color:var(--ball-ink)}
/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
th.sort{cursor:pointer}
th.num,td.num{text-align:right}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.inactive{opacity:.55}
tr.yo td{background:color-mix(in srgb,var(--ball) 18%,var(--surface))}
/* Lista de jornadas */
.jlist{display:flex;flex-direction:column;gap:8px}
.jitem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;width:100%}
.jitem:hover{border-color:var(--accent)}
.jnum{font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.jnum small{display:block;font-size:11px;font-family:var(--body);font-weight:600;color:var(--muted);letter-spacing:.08em}
.jitem .main{min-width:0}
.jitem .rival{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Disponibilidad */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-left:1px solid var(--line);padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button.on.si{background:var(--win-bg);color:var(--win)}
.seg button.on.duda{background:var(--maybe-bg);color:var(--maybe)}
.seg button.on.no{background:var(--loss-bg);color:var(--loss)}
.conv{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface)}
.conv.on{background:var(--ball);color:var(--ball-ink);border-color:transparent;font-weight:600}
.conv input{margin:0}
.counts{display:flex;flex-wrap:wrap;gap:6px}
/* Partidos */
.pistas{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.pista{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pista select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.sets{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;align-items:center}
.sets input{width:100%;padding:6px 4px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--display);font-size:20px;font-weight:600}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.sets .side{font-size:13px;color:var(--muted);padding-right:4px}
/* Formularios y modal */
.overlay{position:fixed;inset:0;background:rgba(8,14,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:20;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;padding:20px;width:100%;max-width:460px;border:1px solid var(--line)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:15px}
.form .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{background:var(--maybe-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px)}
.back{margin-bottom:4px}
textarea.copy{width:100%;min-height:140px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1 id="tNombre">Liga de Dobles</h1><p id="tTemp">Seguimiento del equipo</p></div>
    <button class="btn-ghost" data-act="config" type="button">Ajustes</button>
  </div>
</header>
<nav class="tabs" aria-label="Secciones"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"><div class="empty"><h2>Cargando datos…</h2><p>Aquí verás el resumen del equipo, las jornadas y la estadística de cada jugador.</p></div></main>
<div id="modalRoot"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const DEF_CONFIG={nombre:'Mi equipo',temporada:'',pistas:3,stb:true};
const S={jugadores:[],jornadas:[],config:{...DEF_CONFIG},tab:'resumen',jSel:null,sort:{k:'pct',d:-1},loaded:{jugadores:false,jornadas:false},mode:'loading'};
let db=null;
const pend={},busy={},timers={},retries={},borrados=new Set();
const TABS=[['resumen','Resumen'],['liga','Clasificación'],['rivales','Rivales'],['ranking','Ranking'],['jornadas','Jornadas'],['jugadores','Jugadores'],['parejas','Parejas'],['t2526','Temporada 25/26']];
S.liga={clas:null,cal:null,jug:null,plant:null,t2526:null};S.hEq=null;S.hCopa=false;S.hJ='1';S.ligaJ=null;S.rivalSel=null;S.rkEquipo='';S.rkSort={k:'rank',d:1};S.clasProv=true;

/* ---------- Persistencia ---------- */
function localCol(col){return col==='jugadores'?S.jugadores:S.jornadas}
function msgErr(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')return 'Se ha llenado el espacio de datos. Borra jornadas o jugadores antiguos.';
  if(c==='invalid_argument')return 'No tienes permiso para modificar estos datos.';
  if(c==='revoked'||c==='not_granted')return 'Ya no se pueden guardar cambios en esta vista.';
  return 'No se pudo guardar. Inténtalo de nuevo en un momento.';
}
function save(col,doc,delay=350){
  if(col==='config'){S.config={...S.config,...doc}}
  else{const a=localCol(col);const i=a.findIndex(x=>x.id===doc.id);if(i>=0)a[i]=doc;else a.push(doc)}
  if(!db)return;
  const id=col==='config'?'equipo':doc.id;const path=col+'/'+id;
  const body=clone(doc);delete body.id;
  pend[path]=body;clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),delay);
}
async function flush(path){
  if(busy[path]||!pend[path])return;
  const body=pend[path];delete pend[path];busy[path]=true;
  try{await db.doc(path).set(body);retries[path]=0}
  catch(e){
    if(e&&e.code==='unavailable'&&(retries[path]||0)<1){retries[path]=(retries[path]||0)+1;if(!pend[path])pend[path]=body;busy[path]=false;setTimeout(()=>flush(path),600+Math.random()*900);return}
    toast(msgErr(e));
  }
  busy[path]=false;if(pend[path])flush(path);
}
async function removeDoc(col,id){
  const a=localCol(col);const i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);
  if(!db)return;
  const path=col+'/'+id;delete pend[path];clearTimeout(timers[path]);borrados.add(path);
  try{await db.doc(path).delete()}catch(e){toast(msgErr(e))}
}
function sortById(a){return [...a].sort((x,y)=>x.id<y.id?-1:1)}
function onCol(col){
  return snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const ids=new Set(snap.docs.map(d=>d.id));
    for(const p of [...borrados])if(p.startsWith(col+'/')&&!ids.has(p.slice(col.length+1)))borrados.delete(p);
    let arr=snap.docs.filter(d=>!borrados.has(col+'/'+d.id)).map(d=>({...clone(d.data()),id:d.id}));
    const local=localCol(col);
    for(const l of local){const p=col+'/'+l.id;if(pend[p]||busy[p]){const i=arr.findIndex(x=>x.id===l.id);if(i>=0)arr[i]=l;else arr.push(l)}}
    const changed=JSON.stringify(sortById(local))!==JSON.stringify(sortById(arr));
    const first=!S.loaded[col];S.loaded[col]=true;
    if(col==='jugadores')S.jugadores=arr;else S.jornadas=arr;
    if(changed||first)render();
  };
}
async function init(){
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){S.mode='local';S.loaded={jugadores:true,jornadas:true};render();toast('Modo sin guardado: los cambios se perderán al cerrar.');return}
  S.mode='db';
  const err=e=>{toast(msgErr(e))};
  db.collection('jugadores').onSnapshot(onCol('jugadores'),err);
  db.collection('jornadas').onSnapshot(onCol('jornadas'),err);
  db.doc('config/equipo').onSnapshot(s=>{
    if(s.metadata.hasPendingWrites||pend['config/equipo']||busy['config/equipo'])return;
    const n=s.exists?{...DEF_CONFIG,...clone(s.data())}:{...DEF_CONFIG};
    if(JSON.stringify(n)!==JSON.stringify(S.config)){S.config=n;render()}
  },err);
  const ligaSnap=k=>s=>{const n=s.exists?clone(s.data()):null;if(JSON.stringify(n)!==JSON.stringify(S.liga[k])){S.liga[k]=n;if(!document.activeElement||!document.activeElement.matches('input[data-score]'))render()}};
  db.doc('liga/clasificacion').onSnapshot(ligaSnap('clas'),err);
  db.doc('liga/calendario').onSnapshot(ligaSnap('cal'),err);
  db.doc('liga/actas').onSnapshot(ligaSnap('jug'),err);
  db.doc('historico/t2526').onSnapshot(ligaSnap('t2526'),err);
  db.doc('liga/plantillas').onSnapshot(ligaSnap('plant'),err);
}

/* ---------- Cálculos ---------- */
const isNum=v=>v!==''&&v!==null&&v!==undefined&&!isNaN(v);
function partidosDe(jo){
  const n=Math.max(1,Math.min(6,+S.config.pistas||3));const out=[];
  for(let i=0;i<n;i++){const p=(jo.partidos||[])[i]||{};out.push({a:p.a||'',b:p.b||'',sets:[0,1,2].map(k=>((p.sets||[])[k])||{n:'',r:''})})}
  return out;
}
function resPartido(p){
  if(!p||!p.a||!p.b)return null;
  let g=0,l=0,jn=0,jr=0;
  p.sets.forEach((s,k)=>{
    if(!isNum(s.n)||!isNum(s.r))return;const n=+s.n,r=+s.r;
    if(n>r)g++;else if(r>n)l++;
    if(k===2&&S.config.stb){if(n>r)jn++;else if(r>n)jr++}else{jn+=n;jr+=r}
  });
  if(g===l)return null;
  return {r:g>l?'G':'P',g,l,jn,jr};
}
function resJornada(jo){
  const ps=partidosDe(jo);const conPareja=ps.filter(p=>p.a&&p.b);
  let g=0,p=0;ps.forEach(x=>{const r=resPartido(x);if(r){r.r==='G'?g++:p++}});
  const fin=conPareja.length>0&&g+p===conPareja.length;
  return {g,p,fin,jugada:g+p>0,r:g>p?'G':p>g?'P':'E'};
}
function stats(){
  const J={};S.jugadores.forEach(x=>J[x.id]={conv:0,si:0,resp:0,pj:0,g:0,p:0,sg:0,sp:0,jg:0,jp:0});
  const P={};const T={jj:0,jg:0,jp:0,pg:0,pp:0};
  for(const jo of S.jornadas){
    (jo.conv||[]).forEach(id=>{if(J[id])J[id].conv++});
    Object.entries(jo.disp||{}).forEach(([id,v])=>{if(!J[id]||!v)return;J[id].resp++;if(v==='si')J[id].si++});
    const rj=resJornada(jo);if(rj.fin){T.jj++;if(rj.r==='G')T.jg++;else if(rj.r==='P')T.jp++}
    for(const pa of partidosDe(jo)){
      const r=resPartido(pa);if(!r)continue;
      r.r==='G'?T.pg++:T.pp++;
      if(pa.a!==pa.b){const k=[pa.a,pa.b].sort().join('|');P[k]=P[k]||{ids:k.split('|'),pj:0,g:0,p:0,sg:0,sp:0};const q=P[k];q.pj++;r.r==='G'?q.g++:q.p++;q.sg+=r.g;q.sp+=r.l}
      for(const id of new Set([pa.a,pa.b])){const s=J[id];if(!s)continue;s.pj++;r.r==='G'?s.g++:s.p++;s.sg+=r.g;s.sp+=r.l;s.jg+=r.jn;s.jp+=r.jr}
    }
  }
  return {J,P,T};
}
const pct=(g,t)=>t?Math.round(g*100/t):null;
const nombre=id=>{const x=S.jugadores.find(p=>p.id===id);return x?x.nombre:'—'};
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function fFecha(f,largo){if(!f)return 'Sin fecha';const d=new Date(f+'T12:00:00');if(isNaN(d))return f;return d.toLocaleDateString('es-ES',largo?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short',day:'numeric',month:'short'})}
const jornadasOrd=()=>[...S.jornadas].sort((a,b)=>(a.fecha||'9999').localeCompare(b.fecha||'9999')||(a.numero||0)-(b.numero||0));
function proxima(){const h=hoy();return jornadasOrd().find(j=>(j.fecha||'')>=h&&!resJornada(j).fin)||null}
function chipJornada(jo){const r=resJornada(jo);
  if(!r.jugada)return '<span class="chip pend">Pendiente</span>';
  const t=r.g+'–'+r.p;
  if(!r.fin)return `<span class="chip maybe">${t} en juego</span>`;
  return r.r==='G'?`<span class="chip win">Ganada ${t}</span>`:r.r==='P'?`<span class="chip loss">Perdida ${t}</span>`:`<span class="chip pend">Empate ${t}</span>`;
}
function chipPartido(p){const r=resPartido(p);
  if(!p.a||!p.b)return '<span class="chip pend">Sin pareja</span>';
  if(!r)return '<span class="chip pend">Sin resultado</span>';
  return r.r==='G'?'<span class="chip win">Ganado</span>':'<span class="chip loss">Perdido</span>';
}
function dispCounts(jo){const c={si:0,duda:0,no:0,sin:0};activos(jo).forEach(p=>{const v=(jo.disp||{})[p.id];c[v||'sin']++});return c}
function activos(jo){return S.jugadores.filter(p=>p.activo!==false||(jo&&((jo.disp||{})[p.id]||(jo.conv||[]).includes(p.id)))).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'))}

/* ---------- Vistas ---------- */
function render(){
  $('#tNombre').textContent=S.config.nombre||'Mi equipo';
  $('#tTemp').textContent=S.config.temporada?('Temporada '+S.config.temporada):'Liga por equipos · dobles';
  $('#tabs').innerHTML=TABS.map(([k,t])=>`<button type="button" role="tab" data-act="tab" data-k="${k}" aria-selected="${S.tab===k}">${t}</button>`).join('');
  const m=$('#main');
  if(!S.loaded.jugadores||!S.loaded.jornadas){m.innerHTML='<div class="empty"><h2>Cargando datos…</h2><p>Aquí verás el resumen del equipo, las jornadas y la estadística de cada jugador.</p></div>';return}

function vJornada(id){
  const jo=S.jornadas.find(j=>j.id===id);const c=dispCounts(jo);const conv=jo.conv||[];const ps=partidosDe(jo);const jugs=activos(jo);
  const opts=(sel)=>{const cv=jugs.filter(p=>conv.includes(p.id)),rs=jugs.filter(p=>!conv.includes(p.id));
    const o=p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(p.nombre)}</option>`;
    return `<option value="">Elegir jugador</option>${cv.length?`<optgroup label="Convocados">${cv.map(o).join('')}</optgroup>`:''}${rs.length?`<optgroup label="${cv.length?'Resto de la plantilla':'Plantilla'}">${rs.map(o).join('')}</optgroup>`:''}`};
  const setsHead=S.config.stb?['Set 1','Set 2','STB']:['Set 1','Set 2','Set 3'];
  return `<div class="stack">
  <div><button class="link back" type="button" data-act="volver">← Todas las jornadas</button></div>
  <div class="row between" style="align-items:flex-end">
    <div><div class="label">Jornada ${esc(jo.numero||'')} · ${esc(fFecha(jo.fecha,true))}${jo.hora?' · '+esc(jo.hora):''}</div>
    <h2>vs ${esc(jo.rival||'Rival por definir')}</h2><div class="muted">${jo.local===false?'Fuera':'En casa'}${jo.sede?' · '+esc(jo.sede):''}${jo.notas?' · '+esc(jo.notas):''}</div></div>
    <div class="row"><span id="jChip">${chipJornada(jo)}</span>${(()=>{const e=equipoDe(jo.rival);return e?`<button class="btn sec small" type="button" data-act="ver-rival" data-eq="${esc(e)}">Ver rival</button>`:''})()}<button class="btn sec small" type="button" data-act="editar-jornada" data-id="${jo.id}">Editar datos</button></div>
  </div>
  <section class="stack" style="gap:10px">
    <div class="row between"><h3>Disponibilidad y convocatoria</h3>
      <div class="row"><button class="btn sec small" type="button" data-act="convocar-disp" data-id="${jo.id}">Convocar disponibles</button><button class="btn small" type="button" data-act="copiar-conv" data-id="${jo.id}">Copiar convocatoria</button></div></div>
    <div class="counts"><span class="chip win">${c.si} sí</span><span class="chip maybe">${c.duda} duda</span><span class="chip loss">${c.no} no</span><span class="chip pend">${c.sin} sin respuesta</span><span class="chip ball">${conv.length} convocados · ${ps.length*2} necesarios</span></div>
    ${jugs.length?`<div class="tbl-wrap"><table style="min-width:480px"><thead><tr><th>Jugador</th><th>Disponibilidad</th><th>Convocatoria</th></tr></thead><tbody>
    ${jugs.map(p=>{const v=(jo.disp||{})[p.id]||'';const on=conv.includes(p.id);return `<tr><td>${esc(p.nombre)}${p.lado?` <span class="muted" style="font-size:13px">· ${esc(p.lado)}</span>`:''}</td>
      <td><span class="seg" role="group" aria-label="Disponibilidad de ${esc(p.nombre)}">${[['si','Sí'],['duda','Duda'],['no','No']].map(([k,t])=>`<button type="button" class="${k}${v===k?' on':''}" aria-pressed="${v===k}" data-act="disp" data-id="${jo.id}" data-p="${p.id}" data-v="${k}">${t}</button>`).join('')}</span></td>
      <td><button type="button" class="conv${on?' on':''}" aria-pressed="${on}" data-act="conv" data-id="${jo.id}" data-p="${p.id}">${on?'Convocado':'Convocar'}</button></td></tr>`}).join('')}
    </tbody></table></div>`:'<p class="muted">Añade jugadores en la pestaña Jugadores.</p>'}
  </section>
  <section class="stack" style="gap:10px">
    <div class="row between"><h3>Partidos y resultados</h3><button class="btn small" type="button" data-act="copiar-parejas" data-id="${jo.id}">Copiar parejas</button></div>
    <p class="muted" style="margin:0">Anota los juegos de cada set desde el punto de vista de tu equipo${S.config.stb?'; el tercer set es el super tie-break (a 10 puntos)':''}.</p>
    <div class="pistas">${ps.map((p,i)=>`<div class="pista">
      <div class="row between"><h3>Pista ${i+1}</h3><span id="pChip${i}">${chipPartido(p)}</span></div>
      <div class="stack" style="gap:6px">
        <select id="sel-${jo.id}-${i}-a" data-pair="${i}" data-slot="a" data-id="${jo.id}" aria-label="Jugador 1 pista ${i+1}">${opts(p.a)}</select>
        <select id="sel-${jo.id}-${i}-b" data-pair="${i}" data-slot="b" data-id="${jo.id}" aria-label="Jugador 2 pista ${i+1}">${opts(p.b)}</select>
        ${p.a&&p.a===p.b?'<span class="chip loss">Has elegido el mismo jugador dos veces</span>':''}
      </div>
      <div class="sets"><span></span>${setsHead.map(h=>`<span class="h">${h}</span>`).join('')}
        <span class="side">Nosotros</span>${p.sets.map((s,k)=>`<input id="sc-${jo.id}-${i}-${k}-n" inputmode="numeric" maxlength="2" aria-label="Pista ${i+1} ${setsHead[k]} nosotros" data-score="${i}" data-set="${k}" data-side="n" data-id="${jo.id}" value="${esc(s.n)}">`).join('')}
        <span class="side">Rival</span>${p.sets.map((s,k)=>`<input id="sc-${jo.id}-${i}-${k}-r" inputmode="numeric" maxlength="2" aria-label="Pista ${i+1} ${setsHead[k]} rival" data-score="${i}" data-set="${k}" data-side="r" data-id="${jo.id}" value="${esc(s.r)}">`).join('')}
      </div></div>`).join('')}</div>
  </section></div>`;
}
function vJugadores(){
  const {J}=stats();
  const rows=S.jugadores.map(p=>{const s=J[p.id];return {p,s,pct:s.pj?s.g/s.pj:-1,disp:s.resp?s.si/s.resp:-1}});
  const k=S.sort.k,d=S.sort.d;
  const val=r=>k==='nombre'?r.p.nombre.toLowerCase():k==='pct'?r.pct:k==='disp'?r.disp:k==='sets'?r.s.sg-r.s.sp:k==='juegos'?r.s.jg-r.s.jp:r.s[k];
  rows.sort((a,b)=>{const x=val(a),y=val(b);if(x<y)return -d;if(x>y)return d;return a.p.nombre.localeCompare(b.p.nombre,'es')});
  const th=(key,t,num)=>`<th class="sort${num?' num':''}" data-act="sort" data-k="${key}" aria-sort="${k===key?(d>0?'ascending':'descending'):'none'}">${t}${k===key?(d>0?' ↑':' ↓'):''}</th>`;
  const dif=(a,b)=>`${a}–${b}`;
  return `<div class="stack">${bannerEjemplo()}<div class="row between"><h2>Jugadores</h2><button class="btn" type="button" data-act="nuevo-jugador">Añadir jugador</button></div>
  ${rows.length?`<div class="tbl-wrap"><table><thead><tr>${th('nombre','Jugador')}${th('conv','Conv.',1)}${th('disp','Disp.',1)}${th('pj','PJ',1)}${th('g','G',1)}${th('p','P',1)}${th('pct','% vict.',1)}${th('sets','Sets',1)}${th('juegos','Juegos',1)}</tr></thead><tbody>
  ${rows.map(r=>`<tr class="click${r.p.activo===false?' inactive':''}" data-act="editar-jugador" data-id="${r.p.id}" tabindex="0"><td>${esc(r.p.nombre)}${r.p.lado?` <span class="muted" style="font-size:13px">· ${esc(r.p.lado)}</span>`:''}${r.p.activo===false?' <span class="chip pend">Inactivo</span>':''}</td>
    <td class="num">${r.s.conv}</td><td class="num">${r.s.resp?pct(r.s.si,r.s.resp)+'%':'—'}</td><td class="num">${r.s.pj}</td><td class="num">${r.s.g}</td><td class="num">${r.s.p}</td><td class="num">${r.s.pj?pct(r.s.g,r.s.pj)+'%':'—'}</td><td class="num">${dif(r.s.sg,r.s.sp)}</td><td class="num">${dif(r.s.jg,r.s.jp)}</td></tr>`).join('')}
  </tbody></table></div><p class="muted" style="margin:0;font-size:13px">Conv.: jornadas convocado. Disp.: porcentaje de respuestas «sí». Pulsa un jugador para editarlo.</p>`:'<div class="panel empty"><h2>Plantilla vacía</h2><p>Añade a los jugadores del equipo para poder convocarlos.</p></div>'}</div>`;
}
function vParejas(){
  const {P}=stats();const list=Object.values(P).sort((a,b)=>(b.g/b.pj-a.g/a.pj)||b.pj-a.pj);
  return `<div class="stack"><h2>Parejas</h2><p class="muted" style="margin:0">Rendimiento de cada combinación de jugadores que ha jugado junta.</p>
  ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Pareja</th><th class="num">PJ</th><th class="num">G</th><th class="num">P</th><th class="num">% vict.</th><th class="num">Sets</th></tr></thead><tbody>
  ${list.map(q=>`<tr><td>${esc(nombre(q.ids[0]))} / ${esc(nombre(q.ids[1]))}</td><td class="num">${q.pj}</td><td class="num">${q.g}</td><td class="num">${q.p}</td><td class="num">${pct(q.g,q.pj)}%</td><td class="num">${q.sg}–${q.sp}</td></tr>`).join('')}
  </tbody></table></div>`:'<div class="panel empty"><h2>Sin datos todavía</h2><p>Las parejas aparecen cuando anotes resultados en las jornadas.</p></div>'}</div>`;
}

/* ---------- Modales ---------- */
function openModal(html){$('#modalRoot').innerHTML=`<div class="overlay" data-act="cerrar-fondo"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#modalRoot input,#modalRoot select,#modalRoot textarea');if(f)f.focus()}
function closeModal(){$('#modalRoot').innerHTML=''}
function mJugador(id){
  const p=id?S.jugadores.find(x=>x.id===id):{nombre:'',telefono:'',lado:'',notas:'',activo:true};
  openModal(`<form class="form" data-form="jugador" data-id="${id||''}"><h2>${id?'Editar jugador':'Nuevo jugador'}</h2>
    <label>Nombre<input id="f-nombre" name="nombre" required value="${esc(p.nombre)}"></label>
    <div class="two"><label>Teléfono<input id="f-tel" name="telefono" inputmode="tel" value="${esc(p.telefono)}"></label>
    <label>Lado preferido<select id="f-lado" name="lado">${['','Drive','Revés','Ambos'].map(v=>`<option value="${v}"${p.lado===v?' selected':''}>${v||'Sin indicar'}</option>`).join('')}</select></label></div>
    <label>Notas<textarea id="f-notas" name="notas" rows="2">${esc(p.notas)}</textarea></label>
    <label class="check"><input id="f-activo" type="checkbox" name="activo"${p.activo!==false?' checked':''}> Activo en la plantilla</label>
    <div class="row between"><div class="row"><button class="btn" type="submit">Guardar</button><button class="btn sec" type="button" data-act="cerrar">Cancelar</button></div>
    ${id?`<button class="btn sec small" type="button" data-act="borrar-jugador" data-id="${id}">Borrar</button>`:''}</div></form>`);
}
function mJornada(id){
  const nums=S.jornadas.map(j=>+j.numero||0);
  const jo=id?S.jornadas.find(x=>x.id===id):{numero:(nums.length?Math.max(...nums):0)+1,fecha:'',hora:'',rival:'',local:true,sede:'',notas:''};
  openModal(`<form class="form" data-form="jornada" data-id="${id||''}"><h2>${id?'Editar jornada':'Nueva jornada'}</h2>
    <div class="two"><label>Número<input id="f-num" name="numero" type="number" min="1" value="${esc(jo.numero)}"></label>
    <label>Campo<select id="f-local" name="local"><option value="1"${jo.local!==false?' selected':''}>En casa</option><option value="0"${jo.local===false?' selected':''}>Fuera</option></select></label></div>
    <div class="two"><label>Fecha<input id="f-fecha" name="fecha" type="date" value="${esc(jo.fecha)}"></label><label>Hora<input id="f-hora" name="hora" type="time" value="${esc(jo.hora)}"></label></div>
    <label>Rival<input id="f-rival" name="rival" value="${esc(jo.rival)}" placeholder="Nombre del club o equipo"></label>
    <label>Club / sede<input id="f-sede" name="sede" value="${esc(jo.sede)}"></label>
    <label>Notas<textarea id="f-jnotas" name="notas" rows="2">${esc(jo.notas)}</textarea></label>
    <div class="row between"><div class="row"><button class="btn" type="submit">Guardar</button><button class="btn sec" type="button" data-act="cerrar">Cancelar</button></div>
    ${id?`<button class="btn sec small" type="button" data-act="borrar-jornada" data-id="${id}">Borrar</button>`:''}</div></form>`);
}
function mConfig(){
  const c=S.config;
  openModal(`<form class="form" data-form="config"><h2>Ajustes del equipo</h2>
    <label>Nombre del equipo<input id="f-cnombre" name="nombre" value="${esc(c.nombre)}"></label>
    <label>Temporada<input id="f-temp" name="temporada" value="${esc(c.temporada)}" placeholder="2026-27"></label>
    <label>Partidos de dobles por jornada<input id="f-pistas" name="pistas" type="number" min="1" max="6" value="${esc(c.pistas)}"></label>
    <label class="check"><input id="f-stb" type="checkbox" name="stb"${c.stb?' checked':''}> El tercer set es super tie-break</label>
    <div class="row"><button class="btn" type="submit">Guardar</button><button class="btn sec" type="button" data-act="cerrar">Cancelar</button></div></form>`);
}
function cabeceraJornada(jo,ca){
  return `${S.config.nombre||'Equipo'} · Jornada ${jo.numero||''}\n${fFecha(jo.fecha,true)}${jo.hora?(ca?' a les ':' a las ')+jo.hora:''}\nvs ${jo.rival||(ca?'rival per definir':'rival por definir')} (${jo.local===false?(ca?'fora':'fuera'):(ca?'a casa':'en casa')})${jo.sede?' · '+jo.sede:''}`;
}
function textoConvocatoria(jo){
  const ca=window.__LOC==='ca-ES';const conv=(jo.conv||[]).map(nombre);
  return `${cabeceraJornada(jo,ca)}\n\n${ca?'Convocats':'Convocados'}:\n${conv.length?conv.map(n=>'- '+n).join('\n'):(ca?'- (sense convocats)':'- (sin convocados)')}${jo.notas?'\n\n'+jo.notas:''}`;
}
function textoParejas(jo){
  const ca=window.__LOC==='ca-ES';const ps=partidosDe(jo).filter(p=>p.a||p.b);if(!ps.length)return '';
  const usados=new Set();
  const lineas=partidosDe(jo).map((p,i)=>{if(p.a)usados.add(p.a);if(p.b)usados.add(p.b);return `Pista ${i+1}: ${p.a?nombre(p.a):'—'} / ${p.b?nombre(p.b):'—'}`});
  const reservas=(jo.conv||[]).filter(id=>!usados.has(id)).map(nombre);
  return `${cabeceraJornada(jo,ca)}\n\n${ca?'Parelles':'Parejas'}:\n${lineas.join('\n')}${reservas.length?`\n\n${ca?'Reserves':'Reservas'}: ${reservas.join(', ')}`:''}`;
}

/* ---------- Eventos ---------- */
let confirmPend=null;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='cerrar-fondo'){if(e.target===t)closeModal();return}
  const jo=id?S.jornadas.find(j=>j.id===id):null;
  switch(a){
    case 'tab':S.tab=t.dataset.k;S.jSel=null;render();window.scrollTo(0,0);break;
    case 'config':mConfig();break;
    case 'cerrar':closeModal();break;
    case 'nuevo-jugador':mJugador();break;
    case 'editar-jugador':mJugador(id);break;
    case 'nueva-jornada':mJornada();break;
    case 'editar-jornada':mJornada(id);break;
    case 'abrir-jornada':S.tab='jornadas';S.jSel=id;render();window.scrollTo(0,0);break;
    case 'volver':S.jSel=null;render();break;
    case 'rk-sort':{const k=t.dataset.k;S.rkSort=S.rkSort.k===k?{k,d:-S.rkSort.d}:{k,d:(k==='rank'||k==='nombre'||k==='equipo')?1:-1};render();break}
    case 'h-copa':S.hCopa=t.dataset.v==='1';render();break;
    case 'clas-prov':S.clasProv=t.dataset.v==='1';render();break;
    case 'ver-rival':S.tab='rivales';S.rivalSel=t.dataset.eq;S.jSel=null;render();window.scrollTo(0,0);break;
    case 'sort':{const k=t.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==='nombre'?1:-1};render();break}
    case 'disp':{jo.disp=jo.disp||{};const v=t.dataset.v;jo.disp[t.dataset.p]=jo.disp[t.dataset.p]===v?'':v;save('jornadas',jo);render();break}
    case 'conv':{const c=new Set(jo.conv||[]);c.has(t.dataset.p)?c.delete(t.dataset.p):c.add(t.dataset.p);jo.conv=[...c];save('jornadas',jo);render();break}
    case 'convocar-disp':{const c=new Set(jo.conv||[]);Object.entries(jo.disp||{}).forEach(([p,v])=>{if(v==='si')c.add(p)});jo.conv=[...c];save('jornadas',jo);render();toast('Convocados todos los disponibles');break}
    case 'copiar-conv':
    case 'copiar-parejas':{const esPar=a==='copiar-parejas';const txt=esPar?textoParejas(jo):textoConvocatoria(jo);
      if(!txt){toast('Todavía no hay parejas en esta jornada.');break}
      const fallback=()=>{openModal(`<div class="form"><h2>${esPar?'Parejas':'Convocatoria'}</h2><p class="muted" style="margin:0">Selecciona el texto y cópialo.</p><textarea class="copy" id="f-copy" readonly>${esc(txt)}</textarea><div class="row"><button class="btn sec" type="button" data-act="cerrar">Cerrar</button></div></div>`);const ta=$('#f-copy');ta.focus();ta.select()};
      try{navigator.clipboard.writeText(txt).then(()=>toast(esPar?'Parejas copiadas. Pégalas en WhatsApp o en un correo.':'Convocatoria copiada. Pégala en WhatsApp o en un correo.'),fallback)}catch(err){fallback()}break}
    case 'borrar-jugador':
    case 'borrar-jornada':
    case 'borrar-ejemplos':{
      if(confirmPend!==t){confirmPend=t;t.textContent='Pulsa otra vez para confirmar';t.classList.add('danger');return}
      confirmPend=null;
      if(a==='borrar-jugador'){removeDoc('jugadores',id);closeModal();render();toast('Jugador borrado')}
      else if(a==='borrar-jornada'){removeDoc('jornadas',id);S.jSel=null;closeModal();render();toast('Jornada borrada')}
      else{S.jugadores.filter(x=>x.ejemplo).map(x=>x.id).forEach(i=>removeDoc('jugadores',i));S.jornadas.filter(x=>x.ejemplo).map(x=>x.id).forEach(i=>removeDoc('jornadas',i));S.jSel=null;render();toast('Datos de ejemplo borrados')}
      break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();
  if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click();
});
document.addEventListener('change',e=>{
  const s=e.target;
  if(s.matches('select[data-liga-j]')){S.ligaJ=+s.value;render();return}
  if(s.matches('select[data-h-eq]')){S.hEq=s.value;render();return}
  if(s.matches('select[data-h-j]')){S.hJ=s.value;render();return}
  if(s.matches('select[data-rival-sel]')){S.rivalSel=s.value;render();return}
  if(s.matches('select[data-rk-eq]')){S.rkEquipo=s.value;render();return}if(!s.matches('select[data-pair]'))return;
  const jo=S.jornadas.find(j=>j.id===s.dataset.id);if(!jo)return;
  const ps=partidosDe(jo);ps[+s.dataset.pair][s.dataset.slot]=s.value;jo.partidos=ps;save('jornadas',jo,150);render();
});
document.addEventListener('input',e=>{
  const s=e.target;if(!s.matches('input[data-score]'))return;
  s.value=s.value.replace(/\D/g,'').slice(0,2);
  const jo=S.jornadas.find(j=>j.id===s.dataset.id);if(!jo)return;
  const ps=partidosDe(jo);const i=+s.dataset.score;ps[i].sets[+s.dataset.set][s.dataset.side]=s.value===''?'':+s.value;jo.partidos=ps;
  save('jornadas',jo,700);
  const c=$('#pChip'+i);if(c)c.innerHTML=chipPartido(ps[i]);const jc=$('#jChip');if(jc)jc.innerHTML=chipJornada(jo);
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const fd=new FormData(f);const g=k=>(fd.get(k)||'').toString().trim();
  if(f.dataset.form==='jugador'){
    if(!g('nombre')){toast('Escribe el nombre del jugador');return}
    const id=f.dataset.id;const prev=id?S.jugadores.find(x=>x.id===id):{};
    save('jugadores',{...prev,id:id||uid('p'),nombre:g('nombre'),telefono:g('telefono'),lado:g('lado'),notas:g('notas'),activo:fd.get('activo')==='on'},100);
    closeModal();render();toast(id?'Jugador actualizado':'Jugador añadido');
  }else if(f.dataset.form==='jornada'){
    const id=f.dataset.id;const prev=id?S.jornadas.find(x=>x.id===id):{disp:{},conv:[],partidos:[]};
    const nid=id||uid('j');
    save('jornadas',{...prev,id:nid,numero:+g('numero')||'',fecha:g('fecha'),hora:g('hora'),rival:g('rival'),local:g('local')!=='0',sede:g('sede'),notas:g('notas')},100);
    closeModal();S.tab='jornadas';S.jSel=nid;render();toast(id?'Jornada actualizada':'Jornada creada');
  }else if(f.dataset.form==='config'){
    save('config',{nombre:g('nombre')||'Mi equipo',temporada:g('temporada'),pistas:Math.max(1,Math.min(6,+g('pistas')||3)),stb:fd.get('stb')==='on'},100);
    closeModal();render();toast('Ajustes guardados');
  }
});
let tt;function toast(m){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true},3200)}

render();init();
</script>
