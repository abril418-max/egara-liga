/* Layout: cabecera de pista (azul pista dura con líneas de dobles), pestañas, contenido en una columna de 1080px máx. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#14202e; --muted:#5a6778; --line:#d6dde6;

  --win:#1c7a48; --win-bg:#e3f3ea; --loss:#b3372f; --loss-bg:#f8e6e4; --maybe:#9a6a0c; --maybe-bg:#f7eed9;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1520; --surface:#162130; --surface-2:#1b2838; --ink:#e5ebf2; --muted:#94a2b4; --line:#2a3849;
  --accent:#6fa3e3; --accent-ink:#0b1420; --ball:#d9e84a; --ball-ink:#1d2a05;
  --win:#53c48c; --win-bg:#173427; --loss:#f07d72; --loss-bg:#3a1d1c; --maybe:#e3b14e; --maybe-bg:#382c14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520; --surface:#162130; --surface-2:#1b2838; --ink:#e5ebf2; --muted:#94a2b4; --line:#2a3849;
  --accent:#6fa3e3; --accent-ink:#0b1420; --ball:#d9e84a; --ball-ink:#1d2a05;
  --win:#53c48c; --win-bg:#173427; --loss:#f07d72; --loss-bg:#3a1d1c; --maybe:#e3b14e; --maybe-bg:#382c14;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
/* Cabecera */
.top{background:#1d4e89;color:#fff;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:rgba(255,255,255,.85);box-shadow:0 5px 0 rgba(255,255,255,.55)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 26px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:4px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 12px 10px;cursor:pointer;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:.02em}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid2>*{min-width:0}
/* Botones */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--loss);color:#fff}
.btn.small{padding:6px 10px;font-size:14px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:32px;font-weight:600;line-height:1.1}
/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.win{background:var(--win-bg);color:var(--win)}
.chip.loss{background:var(--loss-bg);color:var(--loss)}
.chip.pend{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.maybe{background:var(--maybe-bg);color:var(--maybe)}
.chip.ball{background:var(--ball);color:var(--ball-ink)}
/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
th.sort{cursor:pointer}
th.num,td.num{text-align:right}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.inactive{opacity:.55}
tr.yo td{background:color-mix(in srgb,var(--ball) 18%,var(--surface))}

.jlist{display:flex;flex-direction:column;gap:8px}
.jitem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;text-align:left;width:100%}
.jitem:hover{border-color:var(--accent)}
.jnum{font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.jnum small{display:block;font-size:11px;font-family:var(--body);font-weight:600;color:var(--muted);letter-spacing:.08em}
.jitem .main{min-width:0}
.jitem .rival{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Disponibilidad */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-left:1px solid var(--line);padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button.on.si{background:var(--win-bg);color:var(--win)}
.seg button.on.duda{background:var(--maybe-bg);color:var(--maybe)}
.seg button.on.no{background:var(--loss-bg);color:var(--loss)}
.conv{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface)}
.conv.on{background:var(--ball);color:var(--ball-ink);border-color:transparent;font-weight:600}
.conv input{margin:0}
.counts{display:flex;flex-wrap:wrap;gap:6px}
/* Partidos */
.pistas{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.pista{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pista select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.sets{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;align-items:center}
.sets input{width:100%;padding:6px 4px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--display);font-size:20px;font-weight:600}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.sets .side{font-size:13px;color:var(--muted);padding-right:4px}

.modal{background:var(--surface);border-radius:12px;padding:20px;width:100%;max-width:460px;border:1px solid var(--line)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:15px}
.form .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{background:var(--maybe-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100% - 32px)}
.back{margin-bottom:4px}
textarea.copy{width:100%;min-height:140px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.ro [data-act="nuevo-jugador"], .ro [data-act="nueva-jornada"], .ro [data-act="editar-jornada"], .ro [data-act="convocar-disp"], .ro [data-act="borrar-ejemplos"]{display:none!important}

.ro .seg button.mia,.ro .seg button[data-act=h-copa],.ro .seg button[data-act=clas-prov]{pointer-events:auto;cursor:pointer;opacity:1}
.ro .pista select:disabled,.ro .sets input:disabled{opacity:1;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

const clone=o=>JSON.parse(JSON.stringify(o));
const DEF_CONFIG={nombre:'Mi equipo',temporada:'',pistas:3,stb:true};
const S={jugadores:[],jornadas:[],config:{...DEF_CONFIG},tab:'resumen',jSel:null,sort:{k:'pct',d:-1},loaded:{jugadores:false,jornadas:false},mode:'loading'};
let db=null;
const pend={},busy={},timers={},retries={},borrados=new Set();
const TABS=[...(window.__DISP_URL?[['mia','Mi disponibilidad']]:[]),['resumen','Resumen'],['liga','Clasificación'],['calendario','Calendario'],['rivales','Rivales'],['ranking','Ranking'],['jornadas','Jornadas'],['jugadores','Jugadores'],['parejas','Parejas'],['t2526','Temporada 25/26']];
S.liga={clas:null,cal:null,jug:null,plant:null,t2526:null};S.hEq=null;S.hCopa=false;S.hJ='1';S.ligaJ=null;S.rivalSel=null;S.rkEquipo='';S.rkSort={k:'rank',d:1};S.clasProv=true;

/* ---------- Persistencia ---------- */
function localCol(col){return col==='jugadores'?S.jugadores:S.jornadas}
function msgErr(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')return 'Se ha llenado el espacio de datos. Borra jornadas o jugadores antiguos.';
  if(c==='invalid_argument')return 'No tienes permiso para modificar estos datos.';
  if(c==='revoked'||c==='not_granted')return 'Ya no se pueden guardar cambios en esta vista.';
  return 'No se pudo guardar. Inténtalo de nuevo en un momento.';
}
function save(col,doc,delay=350){
  if(col==='config'){S.config={...S.config,...doc}}
  else{const a=localCol(col);const i=a.findIndex(x=>x.id===doc.id);if(i>=0)a[i]=doc;else a.push(doc)}
  if(!db)return;
  const id=col==='config'?'equipo':doc.id;const path=col+'/'+id;
  const body=clone(doc);delete body.id;
  pend[path]=body;clearTimeout(timers[path]);timers[path]=setTimeout(()=>flush(path),delay);
}
async function flush(path){
  if(busy[path]||!pend[path])return;
  const body=pend[path];delete pend[path];busy[path]=true;
  try{await db.doc(path).set(body);retries[path]=0}
  catch(e){
    if(e&&e.code==='unavailable'&&(retries[path]||0)<1){retries[path]=(retries[path]||0)+1;if(!pend[path])pend[path]=body;busy[path]=false;setTimeout(()=>flush(path),600+Math.random()*900);return}
    toast(msgErr(e));
  }
  busy[path]=false;if(pend[path])flush(path);
}
async function removeDoc(col,id){
  const a=localCol(col);const i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);
  if(!db)return;
  const path=col+'/'+id;delete pend[path];clearTimeout(timers[path]);borrados.add(path);
  try{await db.doc(path).delete()}catch(e){toast(msgErr(e))}
}
function sortById(a){return [...a].sort((x,y)=>x.id<y.id?-1:1)}
function onCol(col){
  return snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const ids=new Set(snap.docs.map(d=>d.id));
    for(const p of [...borrados])if(p.startsWith(col+'/')&&!ids.has(p.slice(col.length+1)))borrados.delete(p);
    let arr=snap.docs.filter(d=>!borrados.has(col+'/'+d.id)).map(d=>({...clone(d.data()),id:d.id}));
    const local=localCol(col);
    for(const l of local){const p=col+'/'+l.id;if(pend[p]||busy[p]){const i=arr.findIndex(x=>x.id===l.id);if(i>=0)arr[i]=l;else arr.push(l)}}
    const changed=JSON.stringify(sortById(local))!==JSON.stringify(sortById(arr));
    const first=!S.loaded[col];S.loaded[col]=true;
    if(col==='jugadores')S.jugadores=arr;else S.jornadas=arr;
    if(changed||first)render();
  };
}
async function init(){
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){S.mode='local';S.loaded={jugadores:true,jornadas:true};render();toast('Modo sin guardado: los cambios se perderán al cerrar.');return}
  S.mode='db';
  const err=e=>{toast(msgErr(e))};
  db.collection('jugadores').onSnapshot(onCol('jugadores'),err);
  db.collection('jornadas').onSnapshot(onCol('jornadas'),err);
  db.doc('config/equipo').onSnapshot(s=>{
    if(s.metadata.hasPendingWrites||pend['config/equipo']||busy['config/equipo'])return;
    const n=s.exists?{...DEF_CONFIG,...clone(s.data())}:{...DEF_CONFIG};
    if(JSON.stringify(n)!==JSON.stringify(S.config)){S.config=n;render()}
  },err);
  const ligaSnap=k=>s=>{const n=s.exists?clone(s.data()):null;if(JSON.stringify(n)!==JSON.stringify(S.liga[k])){S.liga[k]=n;if(!document.activeElement||!document.activeElement.matches('input[data-score]'))render()}};
  db.doc('liga/clasificacion').onSnapshot(ligaSnap('clas'),err);
  db.doc('liga/calendario').onSnapshot(ligaSnap('cal'),err);
  db.doc('liga/actas').onSnapshot(ligaSnap('jug'),err);
  db.doc('historico/t2526').onSnapshot(ligaSnap('t2526'),err);
  db.doc('liga/plantillas').onSnapshot(ligaSnap('plant'),err);

/* ---------- Cálculos ---------- */
const isNum=v=>v!==''&&v!==null&&v!==undefined&&!isNaN(v);
function partidosDe(jo){
  const n=Math.max(1,Math.min(6,+S.config.pistas||3));const out=[];
  for(let i=0;i<n;i++){const p=(jo.partidos||[])[i]||{};out.push({a:p.a||'',b:p.b||'',sets:[0,1,2].map(k=>((p.sets||[])[k])||{n:'',r:''})})}
  return out;
}
function resPartido(p){
  if(!p||!p.a||!p.b)return null;
  let g=0,l=0,jn=0,jr=0;
  p.sets.forEach((s,k)=>{
    if(!isNum(s.n)||!isNum(s.r))return;const n=+s.n,r=+s.r;
    if(n>r)g++;else if(r>n)l++;
    if(k===2&&S.config.stb){if(n>r)jn++;else if(r>n)jr++}else{jn+=n;jr+=r}
  });
  if(g===l)return null;
  return {r:g>l?'G':'P',g,l,jn,jr};
}
function resJornada(jo){
  const ps=partidosDe(jo);const conPareja=ps.filter(p=>p.a&&p.b);
  let g=0,p=0;ps.forEach(x=>{const r=resPartido(x);if(r){r.r==='G'?g++:p++}});
  const fin=conPareja.length>0&&g+p===conPareja.length;
  return {g,p,fin,jugada:g+p>0,r:g>p?'G':p>g?'P':'E'};
}
function stats(){
  const J={};S.jugadores.forEach(x=>J[x.id]={conv:0,si:0,resp:0,pj:0,g:0,p:0,sg:0,sp:0,jg:0,jp:0});
  const P={};const T={jj:0,jg:0,jp:0,pg:0,pp:0};
  for(const jo of S.jornadas){
    (jo.conv||[]).forEach(id=>{if(J[id])J[id].conv++});
    Object.entries(jo.disp||{}).forEach(([id,v])=>{if(!J[id]||!v)return;J[id].resp++;if(v==='si')J[id].si++});
    const rj=resJornada(jo);if(rj.fin){T.jj++;if(rj.r==='G')T.jg++;else if(rj.r==='P')T.jp++}
    for(const pa of partidosDe(jo)){
      const r=resPartido(pa);if(!r)continue;
      r.r==='G'?T.pg++:T.pp++;
      if(pa.a!==pa.b){const k=[pa.a,pa.b].sort().join('|');P[k]=P[k]||{ids:k.split('|'),pj:0,g:0,p:0,sg:0,sp:0};const q=P[k];q.pj++;r.r==='G'?q.g++:q.p++;q.sg+=r.g;q.sp+=r.l}
      for(const id of new Set([pa.a,pa.b])){const s=J[id];if(!s)continue;s.pj++;r.r==='G'?s.g++:s.p++;s.sg+=r.g;s.sp+=r.l;s.jg+=r.jn;s.jp+=r.jr}
    }
  }
  return {J,P,T};
}
const pct=(g,t)=>t?Math.round(g*100/t):null;
const nombre=id=>{const x=S.jugadores.find(p=>p.id===id);return x?x.nombre:'—'};

function fFecha(f,largo){if(!f)return 'Sin fecha';const d=new Date(f+'T12:00:00');if(isNaN(d))return f;return d.toLocaleDateString(window.__LOC||'es-ES',largo?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short',day:'numeric',month:'short'})}
const jornadasOrd=()=>[...S.jornadas].sort((a,b)=>(a.fecha||'9999').localeCompare(b.fecha||'9999')||(a.numero||0)-(b.numero||0));
function proxima(){const h=hoy();return jornadasOrd().find(j=>(j.fecha||'')>=h&&!resJornada(j).fin)||null}
function chipJornada(jo){const r=resJornada(jo);
  if(!r.jugada)return '<span class="chip pend">Pendiente</span>';
  const t=r.g+'–'+r.p;
  if(!r.fin)return `<span class="chip maybe">${t} en juego</span>`;
  return r.r==='G'?`<span class="chip win">Ganada ${t}</span>`:r.r==='P'?`<span class="chip loss">Perdida ${t}</span>`:`<span class="chip pend">Empate ${t}</span>`;
}
function chipPartido(p){const r=resPartido(p);
  if(!p.a||!p.b)return '<span class="chip pend">Sin pareja</span>';
  if(!r)return '<span class="chip pend">Sin resultado</span>';
  return r.r==='G'?'<span class="chip win">Ganado</span>':'<span class="chip loss">Perdido</span>';
}
function dispCounts(jo){const c={si:0,duda:0,no:0,sin:0};activos(jo).forEach(p=>{const v=(jo.disp||{})[p.id];c[v||'sin']++});return c}
function activos(jo){return S.jugadores.filter(p=>p.activo!==false||(jo&&((jo.disp||{})[p.id]||(jo.conv||[]).includes(p.id)))).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'))}

const toks=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(t=>t&&t!=='h');
function equiposLiga(){const c=S.liga.clas;if(c&&c.filas)return c.filas.map(f=>f.equipo);return S.liga.plant?Object.keys(S.liga.plant.equipos):[]}
function equipoDe(rival){const t=toks(rival);if(!t.length)return null;const m=equiposLiga().filter(e=>{const et=toks(e);return t.every(x=>et.includes(x))});return m.length===1?m[0]:null}
const pctTxt=(a,b)=>b?Math.round(a*100/b)+'%':'—';
const sgn=n=>n>0?'+'+n:String(n);
/* Encuentros del equipo anotados en la app que la web aún no tiene */
function encuentrosApp(){
  const mio=miEquipo();const cal=(S.liga.cal&&S.liga.cal.jornadas)||[];if(!mio)return [];
  const oficiales=new Set(((S.liga.jug&&S.liga.jug.encuentros)||[]).map(e=>e.local+'|'+e.visitante));
  const out=[];
  for(const jo of S.jornadas){
    if(!resJornada(jo).fin)continue;
    const cj=cal.find(c=>c.j===+jo.numero);if(!cj)continue;
    const fx=cj.partidos.find(p=>p.local===mio||p.visitante===mio);if(!fx)continue;
    if(oficiales.has(fx.local+'|'+fx.visitante))continue;
    const casa=fx.local===mio;
    const partidos=partidosDe(jo).map((p,i)=>{const r=resPartido(p);if(!r)return null;
      const nuestros=[nombre(p.a),nombre(p.b)];
      const sets=p.sets.filter(s=>isNum(s.n)&&isNum(s.r)).map(s=>casa?{l:+s.n,v:+s.r}:{l:+s.r,v:+s.n});
      const gan=(r.r==='G')===casa?'L':'V';
      return {pista:i+1,L:casa?nuestros:[],V:casa?[]:nuestros,sets,ganador:gan,retirada:null};
    }).filter(Boolean);
    const gl=partidos.filter(p=>p.ganador==='L').length,gv=partidos.length-gl;
    out.push({jornada:cj.j,local:fx.local,visitante:fx.visitante,res:gl+':'+gv,partidos,provisional:true});
  }
  return out;
}
function todosEncuentros(){return [...((S.liga.jug&&S.liga.jug.encuentros)||[]),...encuentrosApp()]}
function clasActual(){
  const c=S.liga.clas;if(!c||!c.filas)return null;
  const extra=encuentrosApp();
  if(!S.clasProv||!extra.length)return {filas:c.filas,provisional:false};
  const F={};c.filas.forEach(f=>F[f.equipo]={...f});
  for(const e of extra){
    const gl=e.partidos.filter(p=>p.ganador==='L').length,gv=e.partidos.length-gl;
    for(const [eq,lado,g,p] of [[e.local,'L',gl,gv],[e.visitante,'V',gv,gl]]){
      const f=F[eq];if(!f)continue;
      f.EJ++;f.PJ+=e.partidos.length;f.PG+=g;f.PP+=p;
      if(g>p){f.EG++;f.P+=3}else if(g===p){f.EE++;f.P+=2}else{f.EP++;f.P+=1}
      for(const pa of e.partidos)pa.sets.forEach((s,i)=>{const a=lado==='L'?s.l:s.v,b=lado==='L'?s.v:s.l;if(i===2&&S.config.stb)return;if(a>b)f.SG++;else if(b>a)f.SP++;f.JG+=a;f.JP+=b});
      f.DS=f.SG-f.SP;f.DJ=f.JG-f.JP;f.prov=true;
    }
  }
  const filas=Object.values(F).sort((a,b)=>b.P-a.P||b.DS-a.DS||b.DJ-a.DJ||b.SG-a.SG||b.JG-a.JG);
  filas.forEach((f,i)=>f.pos=(i+1)+'º');
  return {filas,provisional:true};
}
function statsActas(){return statsFrom(todosEncuentros())}
function statsFrom(encs){
  const P={};
  for(const e of encs){
    for(const p of e.partidos){
      for(const lado of ['L','V']){
        const eq=lado==='L'?e.local:e.visitante;const gana=p.ganador===lado;
        for(const n of p[lado]){
          const k=eq+'|'+n;const x=P[k]=P[k]||{nombre:n,equipo:eq,PJ:0,PG:0,PP:0,SG:0,SP:0,JG:0,JP:0,RET:0,PL:0,PV:0,pistas:[],parejas:[]};
          if(e.provisional)x.prov=true;
          x.PJ++;gana?x.PG++:x.PP++;lado==='L'?x.PL++:x.PV++;if(p.retirada)x.RET++;
          x.pistas.push(p.pista);x.parejas.push({j:e.jornada,pista:p.pista,con:p[lado].find(m=>m!==n)||'',gana,rival:lado==='L'?e.visitante:e.local});
          p.sets.forEach((s,i)=>{const a=lado==='L'?s.l:s.v,b=lado==='L'?s.v:s.l;if(a>b)x.SG++;else if(b>a)x.SP++;const stb=i===2&&(a>=10||b>=10||S.config.stb);if(!stb){x.JG+=a;x.JP+=b}});
        }
      }
    }
  }
  return Object.values(P);
}
function rankJug(){return rankFrom(statsActas())}
function rankFrom(f){
  const r=f.map(x=>({...x,pct:x.PJ?x.PG/x.PJ:0,pjg:(x.JG+x.JP)?x.JG/(x.JG+x.JP):0,ds:x.SG-x.SP,dj:x.JG-x.JP,pm:x.pistas.reduce((a,b)=>a+b,0)/x.pistas.length}));
  r.sort((a,b)=>b.PG-a.PG||b.pct-a.pct||b.pjg-a.pjg||b.dj-a.dj||a.nombre.localeCompare(b.nombre,'es'));
  let prev=null,pos=0;r.forEach((x,i)=>{const key=[x.PG,x.pct,x.pjg,x.dj].join('|');if(key!==prev){pos=i+1;prev=key}x.rank=pos});
  return r;
}

      <div class="kpi"><span class="label">Enfrentamientos G–E–P</span><b>${fila?fila.EG+'–'+fila.EE+'–'+fila.EP:'—'}</b></div>
      <div class="kpi"><span class="label">Partidos G–P</span><b>${fila?fila.PG+'–'+fila.PP:'—'}</b></div>

function vJugadores(){
  const {J}=stats();
  const rows=S.jugadores.map(p=>{const s=J[p.id];return {p,s,pct:s.pj?s.g/s.pj:-1,disp:s.resp?s.si/s.resp:-1}});
  const k=S.sort.k,d=S.sort.d;
  const val=r=>k==='nombre'?r.p.nombre.toLowerCase():k==='pct'?r.pct:k==='disp'?r.disp:k==='sets'?r.s.sg-r.s.sp:k==='juegos'?r.s.jg-r.s.jp:r.s[k];
  rows.sort((a,b)=>{const x=val(a),y=val(b);if(x<y)return -d;if(x>y)return d;return a.p.nombre.localeCompare(b.p.nombre,'es')});
  const th=(key,t,num)=>`<th class="sort${num?' num':''}" data-act="sort" data-k="${key}" aria-sort="${k===key?(d>0?'ascending':'descending'):'none'}">${t}${k===key?(d>0?' ↑':' ↓'):''}</th>`;
  const dif=(a,b)=>`${a}–${b}`;
  return `<div class="stack">${bannerEjemplo()}<div class="row between"><h2>Jugadores</h2><button class="btn" type="button" data-act="nuevo-jugador">Añadir jugador</button></div>

    <td class="num">${r.s.conv}</td><td class="num">${r.s.resp?pct(r.s.si,r.s.resp)+'%':'—'}</td><td class="num">${r.s.pj}</td><td class="num">${r.s.g}</td><td class="num">${r.s.p}</td><td class="num">${r.s.pj?pct(r.s.g,r.s.pj)+'%':'—'}</td><td class="num">${dif(r.s.sg,r.s.sp)}</td><td class="num">${dif(r.s.jg,r.s.jp)}</td></tr>`).join('')}

}
function vParejas(){

function cabeceraJornada(jo,ca){

function textoParejas(jo){
  const ca=window.__LOC==='ca-ES';const ps=partidosDe(jo).filter(p=>p.a||p.b);if(!ps.length)return '';
  const usados=new Set();
  const lineas=partidosDe(jo).map((p,i)=>{if(p.a)usados.add(p.a);if(p.b)usados.add(p.b);return `Pista ${i+1}: ${p.a?nombre(p.a):'—'} / ${p.b?nombre(p.b):'—'}`});
  const reservas=(jo.conv||[]).filter(id=>!usados.has(id)).map(nombre);
  return `${cabeceraJornada(jo,ca)}\n\n${ca?'Parelles':'Parejas'}:\n${lineas.join('\n')}${reservas.length?`\n\n${ca?'Reserves':'Reservas'}: ${reservas.join(', ')}`:''}`;
}

let confirmPend=null;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;if(S.mode==='static'&&RO.has(a))return;
  if(a==='cerrar-fondo'){if(e.target===t)closeModal();return}

    case 'sort':{const k=t.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==='nombre'?1:-1};render();break}
    case 'disp':{jo.disp=jo.disp||{};const v=t.dataset.v;jo.disp[t.dataset.p]=jo.disp[t.dataset.p]===v?'':v;save('jornadas',jo);render();break}

    case 'copiar-conv':

    case 'borrar-jugador':

      if(confirmPend!==t){confirmPend=t;t.textContent='Pulsa otra vez para confirmar';t.classList.add('danger');return}

function tr(s){
  if(LANG!=='ca'||!s)return s;
  const t=s.trim();if(!t)return s;
  if(CA_EXACT[t])return s.replace(t,CA_EXACT[t]);
  let r=t;for(const [a,b] of CA_RX)r=r.replace(a,b);
  return r===t?s:s.replace(t,r);

function traducir(root){
  if(LANG!=='ca')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){if(n.parentElement&&n.parentElement.closest('script,style'))continue;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
  root.querySelectorAll('[aria-label],[placeholder],[title],[alt],optgroup[label]').forEach(e=>['aria-label','placeholder','title','alt','label'].forEach(a=>{const v=e.getAttribute(a);if(v){const x=tr(v);if(x!==v)e.setAttribute(a,x)}}));
}

      <p class="muted" style="margin:0">${window.__TEAM_CODE?'Elige tu nombre. Solo se pide la primera vez en este teléfono.':'Elige tu nombre y escribe el código del equipo que ha enviado el capitán. Solo se pide la primera vez en este teléfono.'}</p>
      <form class="form" id="f-entrar"><label>Jugador<select id="f-yo" required><option value="">Elige tu nombre</option>${act.map(p=>`<option value="${p.id}"${p.id===S.miId?' selected':''}>${esc(p.nombre)}</option>`).join('')}</select></label>
      ${window.__TEAM_CODE?'':`<label>Código del equipo<input id="f-cod" autocomplete="off" autocapitalize="none" required value="${esc(S.codigo)}"></label>`}
      <div><button class="btn" type="submit">Entrar</button></div></form></div>`;
  }
  const h=hoy();const prox=jornadasOrd().filter(j=>(j.fecha||'')>=h);
  const estado=S.remotoEstado==='cargando'?'<span class="chip pend">Cargando respuestas…</span>':S.remotoEstado==='error'?'<span class="chip loss">No se han podido cargar las respuestas</span>':'';
  return `<div class="stack">
    <div class="row between" style="align-items:flex-end"><div><div class="label">Mi disponibilidad</div><h2>Hola, ${esc(yo.nombre.split(' ')[0])}</h2></div>
      <button class="link" type="button" data-act="salir">No soy ${esc(yo.nombre.split(' ')[0])}</button></div>
    <p class="muted" style="margin:0">Marca si puedes jugar cada jornada. Puedes cambiarlo cuando quieras; el equipo lo ve al momento en esta web.</p>${estado}
    ${prox.length?`<div class="jlist">${prox.map(jo=>{const v=(jo.disp||{})[yo.id]||'';const c=dispCounts(jo);const conv=(jo.conv||[]).includes(yo.id);
      return `<div class="panel stack" style="gap:10px;padding:12px 14px">
        <div class="row between"><div><div class="label">Jornada ${esc(jo.numero||'')} · ${esc(fFecha(jo.fecha))}${jo.hora?' · '+esc(jo.hora):''}</div>
          <div style="font-weight:600">${jo.local===false?'en':'vs'} ${esc(jo.rival||'Rival por definir')}</div><div class="muted" style="font-size:13px">${jo.local===false?'Fuera':'En casa'}${jo.sede?' · '+esc(jo.sede):''}</div></div>
          ${conv?'<span class="chip ball">Convocado</span>':''}</div>
        <div class="seg" role="group" aria-label="Mi disponibilidad jornada ${esc(jo.numero||'')}" style="align-self:flex-start">${[['si','Sí puedo'],['duda','Duda'],['no','No puedo']].map(([k,t])=>`<button type="button" class="mia ${k}${v===k?' on':''}" aria-pressed="${v===k}" data-act="mi-disp" data-id="${jo.id}" data-v="${k}" style="padding:9px 14px;font-size:15px">${t}</button>`).join('')}</div>
        <div class="muted" style="font-size:13px">${c.si} disponibles · ${c.duda} en duda · ${c.no} no pueden</div></div>`}).join('')}</div>`:'<p class="muted">No hay jornadas pendientes.</p>'}
  </div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='salir'){S.miId='';ls.set('egara_yo','');render()}
  if(t.dataset.act==='mi-disp'){const jo=S.jornadas.find(j=>j.id===t.dataset.id);if(!jo)return;const cur=(jo.disp||{})[S.miId]||'';guardarDisp(jo.id,S.miId,cur===t.dataset.v?'':t.dataset.v)}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='f-entrar')return;e.preventDefault();
  const yo=document.getElementById('f-yo').value,ce=document.getElementById('f-cod'),cod=window.__TEAM_CODE||(ce?ce.value.trim():'');
  if(!yo||!cod){toast(window.__TEAM_CODE?'Elige tu nombre':'Elige tu nombre y escribe el código');return}
  S.miId=yo;S.codigo=cod;ls.set('egara_yo',yo);if(!window.__TEAM_CODE)ls.set('egara_codigo',cod);render();
});
